# 生产拓扑（04 §1）：nginx 容器直出静态前端 + 反代 api
# 证书与 443 由部署时挂载（Let's Encrypt + certbot 续期），骨架版先放 80 形态 + 443 模板注释
server {
    listen 80;
    server_name _;
    client_max_body_size 110m;

    # gzip（静态资源；JSON 响应体积小不处理）
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    root /data/web;
    index index.html;

    # 安全响应头（04 §5；HSTS 在 443 server 块启用）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # SPA 同源，脚本/连接限 self；接入第三方统计时按需放宽
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Vue3 SPA history 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 443 模板（部署时取消注释并挂载证书卷，04 §5 全站 HTTPS）：
