name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: feijian_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: feijian-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: feijian-api/requirements.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests scripts
      - name: Tests (unit + DB integration)
        env:
          FJ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/feijian_test
          FJ_ENV: dev
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: feijian-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4        # 版本读自 package.json packageManager 字段
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: feijian-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build   # vue-tsc + vite build 类型门禁
