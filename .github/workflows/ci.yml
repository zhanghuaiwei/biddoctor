name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smart-bid-doctor_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: smart-bid-doctor-api
    steps:
      - uses: actions/checkout@v4
      # uv 工作流：setup-uv 自管 Python 与缓存（按 uv.lock 精确还原，--frozen 禁止漂移）
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: smart-bid-doctor-api/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check app tests scripts
      - name: Tests (unit + DB integration)
        env:
          FJ_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/smart-bid-doctor_test
          FJ_ENV: dev
        run: uv run pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smart-bid-doctor-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9   # 与 smart-bid-doctor-web/package.json packageManager 一致（action 在 job 根目录读不到子目录字段）
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: smart-bid-doctor-web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build   # vue-tsc + vite build 类型门禁
