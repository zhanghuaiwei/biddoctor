# 生产拓扑完整形态（04 §1）。开发环境用根 docker-compose.yml（只起 db）。
# 部署：前端静态产物构建后 rsync 到 /data/web； secrets 用 .env 注入（不入库不入镜像）。
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-feijian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?在 .env 中设置}
      POSTGRES_DB: ${POSTGRES_DB:-feijian}
    volumes:
      - /data/pg:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-feijian}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: feijian/api
    build: ./feijian-api
    environment:
      FJ_ENV: prod
      FJ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-feijian}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feijian}
      FJ_JWT_SECRET: ${FJ_JWT_SECRET:?在 .env 中设置强随机值}
      FJ_INTERNAL_TOKEN: ${FJ_INTERNAL_TOKEN:?在 .env 中设置}
      FJ_UPLOAD_DIR: /data/uploads
      FJ_RATE_LIMIT_PER_MIN: ${FJ_RATE_LIMIT_PER_MIN:-120}
    volumes:
      - /data/uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: always
    command: sh -c "python scripts/bootstrap.py && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    # api 无出网需求（04 §5 隔离：worker 专属 LLM 出网白名单）

  worker:
    image: feijian/api
    build: ./feijian-api
    environment:
      FJ_ENV: prod
      FJ_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-feijian}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-feijian}
      FJ_UPLOAD_DIR: /data/uploads
    volumes:
      - /data/uploads:/data/uploads
      - /data/reports:/data/reports
    depends_on:
      db:
        condition: service_healthy
    restart: always
    command: python -m app.worker.runner
    deploy:
      resources:
        limits:
          memory: 3G   # 04 §1：OCR 吃内存，上限 3G 防 OOM 拖垮 api
    # M1 启用 OCR：在 feijian-api/Dockerfile 中放开 paddleocr 安装，并设 ENABLE_OCR=true

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /data/web:/data/web:ro            # 落地页 + SPA 静态产物（无 Node 进程）
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/nginx/certs:/etc/nginx/certs:ro   # Let's Encrypt 证书（部署时挂载）
    depends_on:
      - api
    restart: always
